<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><header><img src="./logo.jpg" alt="OneVoice AI"></header><main>
<p id="status" role="status">Bereit zum Verbinden</p><h1>Gottesdienst mithören</h1>
